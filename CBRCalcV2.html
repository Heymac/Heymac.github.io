<!DOCTYPE html>
<html>
	<head>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
		<style>
			body {
    			display: flex;
    			flex-direction: column;
                background-color: #121212;
                color: white;
			}
			p{
				font-size: 1rem;
    			margin: auto 0rem;
                min-width: 1rem;
    			height: fit-content;
			}
			input, .clickbutton{
				font-size: 1rem;
				border: 0.25rem solid #3f3f3f;
				border-radius: 0.75rem;
				background-color: #ffffff00;
				padding: 0.75rem;
				text-align: center;
				flex-grow:1;
            	color: white;
			}
			p, input, .units, .clickbutton{
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
			}
            input:disabled{
            	color: white;
            }
			.numberinput{
				display: flex;
				margin: 0rem 2rem;
			}
			.inputwrapper{
				display:flex;
				margin: 1rem 2rem 0.5rem auto;
				width: 18rem;
			}
			.wrapperwithbutton{display: flex; flex-direction: column;}
			.numberinputwrapper{display: flex;}

			.clickbutton{
				border-top-left-radius: 0rem;
				border-top-right-radius: 0rem;
				border-bottom-right-radius: 0.75rem;
				margin-top: -0.25rem;
				background-color: #ffffff00;
				border-color: #3f3f3f;

				position: relative;
    			min-width: 16rem;
			}
			.buttonactive{
				background-color: rgb(11 163 120);
				border-color: rgb(11 163 120);
			}
			.unitsappended{
				border-top-right-radius: 0rem;
	    		border-bottom-right-radius: 0rem;
				flex-grow:1;
			}
			.units{
    			font-size: 1.3rem;
    			border: 0.25rem solid #3f3f3f;
    			border-radius: 0.75rem;
    			background-color: #121212;
    			padding: 0.6rem;
    			text-align: center;
    			color: rgb(11 163 120);
    			border-left: 0rem;
    			border-top-left-radius: 0rem;
    			border-bottom-left-radius: 0rem;
    			font-weight: bold;
    			min-width: 4.5rem;
			}
			.units:disabled{
				appearance: none;
				opacity: 1;
            	color:white;
			}
			
            @media only screen and (max-width: 600px) {
				.numberinput {flex-direction: column;}
                .inputwrapper {margin: 1rem 0rem 0.5rem 0rem;width:auto;}
                .numberinput {margin-top: 0.75rem;}
                .button {margin: 0rem;}
			}

            #OCRtext{
            	display: none;
            	white-space: pre-wrap;
            }
            #img{
            	display: none;
            }
		</style>
	</head>
	<body>
		<div class="numberinput">
			<p>Wet Soil + Mold Weight</p>
			<div class="inputwrapper">
				<input id="wetmold" class="unitsappended" type="text" inputmode="decimal" oninput="updateDensity(this)" onclick="clearvalue(this)" value="23.5000" data-realvalue="23.5000" data-unit="lb">
				<select class="units" onchange="updateUnits(wetmold, this.value)">
					<option value="lb">lb</option>
					<option value="g">g</option>
				</select>
			</div>
		</div>
		<div class="numberinput">
			<p>Mold Weight (Spacer Optional)</p>
			<div class="inputwrapper wrapperwithbutton">
				<div class="numberinputwrapper">
					<input id="mold" class="unitsappended" type="text" inputmode="decimal" oninput="updateDensity(this)" onclick="clearvalue(this)" value="15.2500" data-realvalue="15.2500" data-unit="lb">
					<select class="units" onchange="updateUnits(mold, this.value)">
						<option value="lb">lb</option>
						<option value="g">g</option>
					</select>
				</div>

				<div id="spacerbutton" class="clickbutton" onclick="updateButton(this, 'Spacer Not Included', 'Spacer Included')">Spacer Not Included</div>
			</div>
		</div>
		<div class="numberinput">
			<p>Mold Volume</p>
			<div class="inputwrapper">
				<input id="moldvol" class="unitsappended" type="text" inputmode="decimal" oninput="updateDensity(this)" onclick="clearvalue(this)" value="0.07500" data-realvalue="0.07500" data-unit="cubicfeet">
				<select class="units" disabled>
					<option value="cubicfeet">ft³</option>
				</select>
			</div>
		</div>
		<div class="numberinput">
			<p>Moisture Content</p>
			<div class="inputwrapper">
				<input id="mc" class="unitsappended" type="text" inputmode="decimal" oninput="updateDensity(this)" onclick="clearvalue(this)" value="10.0" data-realvalue="10.0" data-unit="percent">
				<select class="units" disabled>
					<option value="percent">%</option>
				</select>
			</div>
		</div>
		<div class="numberinput">
			<p>Max Density</p>
			<div class="inputwrapper">
				<input id="denmax" class="unitsappended" type="text" inputmode="decimal" oninput="updateDensity(this)" onclick="clearvalue(this)" value="100.0" data-realvalue="100.0" data-unit="poundscubicfeet">
				<select class="units" disabled>
					<option value="poundscubicfeet">lb/ft³</option>
				</select>
			</div>
		</div>
		<div class="numberinput">
			<p>Calculated Density</p>
			<div class="inputwrapper">
				<input id="denresult" type="text" class="unitsappended" disabled>
				<select class="units" disabled>
					<option value="percent">%</option>
				</select>
			</div>
		</div>

		<!--<input type="file" id="img" name="img" accept="image/*" capture="user" onchange="recognizeText(this)">
        <p id="OCRtext">OCR Result</p>
        <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>-->

		<script>            
        var wetmold = document.getElementById("wetmold");
        var mold = document.getElementById("mold");
        var spacer = document.getElementById("spacerbutton");
        var moldvol = document.getElementById("moldvol");
        var mc = document.getElementById("mc");
		var denmax = document.getElementById("denmax");
        var denresult = document.getElementById("denresult");
            
	    function updateDensity(id){
	    	if (id.dataset.unit == 'g'){
	    		id.dataset.realvalue = Number(id.value)/453.592;
	    	}
	    	else{
	    		id.dataset.realvalue = id.value;
	    	}

           	let moldweight = Number(mold.dataset.realvalue);
           	let soilmold = Number(wetmold.dataset.realvalue);
           	let moldvolume = Number(moldvol.dataset.realvalue);
           	let moisture = Number(mc.dataset.realvalue);
           	let densitymax = Number(denmax.dataset.realvalue);

           	if(spacer.classList.contains('buttonactive')){
	    		moldweight+=18.88435;
	    	}

            let result = ((soilmold-moldweight)/moldvolume)/(1+(moisture/100));
			let denpercent = (100*(result/densitymax));
           	denresult.value = /*result.toFixed(2)+"  -  "+*/denpercent.toFixed(1)/*+"%"*/;
        }
        function updateUnits(id, unit){
			let weight = Number(id.value);
			if (unit == 'lb'){
				let result = weight/453.592;
				id.value = result.toFixed(5);
				id.dataset.realvalue = result;
				id.dataset.unit = "lb";
			}
			else if (unit == 'g'){
				let result = weight*453.592;
				id.value = result.toFixed(2);
				id.dataset.unit = "g";
			}
			updateDensity(id);
	    }
	    function updateButton(id, offtext, ontext){
	    	id.classList.toggle('buttonactive');
	    	if(id.classList.contains('buttonactive')){
	    		id.innerHTML = ontext;
	    	}
	    	else{
	    		id.innerHTML = offtext;
	    	}
	    	updateDensity(wetmold);
	    }
        function clearvalue(field){
           	field.value = "";
        }
        /*function recognizeText(field){
           	let file = field.files[0];
            let filepath = URL.createObjectURL(file);
            let ocrtext = document.getElementById("OCRtext");
           	(async () => {
                const worker = await Tesseract.createWorker('eng', 1);
                await worker.setParameters({
                	tessedit_char_whitelist: '0123456789.',
                	preserve_interword_spaces: '0',
            	});
            	const ret = await worker.recognize(filepath);
				ocrtext.innerHTML = ret.data.text;
            	console.log(ret.data.text);
            	await worker.terminate();
        	})();
        }*/
        updateDensity(wetmold);
		</script>
	</body>
</html>
