        }
        .dashboard-cell {
            display: table-cell;
            vertical-align: middle;
        }

        }

            border-top: 2px solid #52525b !important;

        }

                    <!-- removed some rows here -->
                    <div class="dashboard-cell px-3 text-center relative">
                        <button onclick="toggleMenu(event, 1)" class="w-8 h-8 inline-flex items-center justify-center text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800/60 rounded cursor-pointer transition-colors">
                            <i class="fa-solid fa-gear"></i>
                        </button>
                        
                    </div>
                </div></div>
        <div class="w-full border-b border-bordercol bg-[#0d0d0d]">
            <button onclick="addRow()" class="flex items-center justify-center gap-2 py-4 bg-[#111] hover:bg-[#181818] text-zinc-400 hover:text-zinc-200 font-medium transition-colors cursor-pointer w-full">
                <i class="fa-solid fa-plus"></i>
                <span>Add  row</span>
            </button>
        </div>
    </div>

    <div id="edit-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center hidden" onclick="closeEditModal(event)">
        <div class="bg-zinc-900 border border-bordercol rounded-lg p-6 w-96 shadow-2xl space-y-4" onclick="event.stopPropagation()">
            <h3 class="font-bold text-zinc-200" id="modal-title">Edit </h3>
            <div class="space-y-3">
                <div>
                    <label class="block font-medium text-zinc-400 mb-1"> Name</label>
                    <input type="text" id="edit-name-input" class="w-full bg-zinc-950 border border-bordercol rounded px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-500">
                </div>
                <div>
                    <label class="block font-medium text-zinc-400 mb-1"> Number</label>
                    <input type="text" id="edit-code-input" class="w-full bg-zinc-950 border border-bordercol rounded px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-500">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeEditModal()" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded font-medium transition-colors cursor-pointer">Cancel</button>
                <button onclick="saveEdit()" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white rounded font-medium transition-colors cursor-pointer">Save</button>
            </div>
        </div>
    </div>

    <div id="block-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center hidden" onclick="closeBlockModal(event)">
        <div id="block-modal-box" class="absolute bg-zinc-900 border border-bordercol rounded-lg p-6 w-96 shadow-2xl space-y-4" onclick="event.stopPropagation()">
            <h3 class="font-bold text-zinc-200">Configure Block</h3>
            <div class="space-y-3">
                <div>
                    <label class="block font-medium text-zinc-400 mb-1">Label / Text</label>
                    <input type="text" id="block-label-input" placeholder="e.g. M or 54" class="w-full bg-zinc-950 border border-bordercol rounded px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-500">
                </div>
                <div id="sub-label-container" class="">
                    <label class="block font-medium text-zinc-400 mb-1">Sub-label (Optional)</label>
                    <input type="text" id="block-sub-input" placeholder="e.g. 13" class="w-full bg-zinc-950 border border-bordercol rounded px-3 py-2 text-zinc-200 focus:outline-none focus:border-zinc-500">
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="block-active-input" class="w-4 h-4 rounded bg-zinc-950 border-bordercol text-emerald-600 focus:ring-0 cursor-pointer">
                    <label for="block-active-input" class="font-medium text-zinc-300 cursor-pointer">Active (Green background)</label>
                </div>
            </div>
            <div class="flex justify-between items-center pt-2">
                <button onclick="deleteCurrentBlock()" class="px-3 py-1.5 bg-red-950/60 hover:bg-red-900/60 text-red-300 rounded font-medium transition-colors cursor-pointer">Remove Block</button>
                <div class="flex gap-2">
                    <button onclick="closeBlockModal()" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded font-medium transition-colors cursor-pointer">Cancel</button>
                    <button onclick="saveBlockEdit()" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white rounded font-medium transition-colors cursor-pointer">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center hidden" onclick="closeDeleteModal(event)">
        <div class="bg-zinc-900 border border-bordercol rounded-lg p-6 w-96 shadow-2xl space-y-4" onclick="event.stopPropagation()">
            <h3 class="font-bold text-zinc-200">Confirm Deletion</h3>
            <p class="text-zinc-400">Are you sure you want to remove this  row? This action cannot be undone.</p>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeDeleteModal()" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded font-medium transition-colors cursor-pointer">Cancel</button>
                <button onclick="confirmDeleteRow()" class="px-3 py-1.5 bg-red-700 hover:bg-red-600 text-white rounded font-medium transition-colors cursor-pointer">Delete</button>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
			let now = new Date();
			let hours = now.getHours();
			let minutes = now.getMinutes();

			function padZero(number) {
				return number < 10 ? '0' + number : number;
			}
			let formattedTime = `${padZero(hours)}:${padZero(minutes)}`;

			document.getElementById('clock').textContent = formattedTime;
		}
        if (JSON.parse(localStorage.getItem('initialData')) == null){
            localStorage.setItem('initialData', '[]');
        }
        const initialData = JSON.parse(localStorage.getItem('initialData'));/*[
            {
                name: "Example",
                code: "1000048976",
                columns: {
                    GS: [],
                    PI: [],
                    MC: [],
                    HYD: [],
                    PRC: [],
                    CBR: [],
                    THR: [],
                    UCC: [],
                    ORG: [],
                    PRM: [],
                    AC: [],
                    SPG: []
                }
            }

            {
                name: "Plant Arkwright",
                code: "1000048976",
                columns: {
                    GS: [
                        { type: 'empty', border: true },
                        { type: 'tag', label: 'M', sub: '13' },
                        { type: 'tag', label: 'M', sub: '01' },
                        { type: 'tag', label: 'M', sub: '07', active: true }
                    ],
                    PI: [
                        { type: 'empty-circle', border: true },
                        { type: 'circle', label: '54' },
                        { type: 'circle', label: '13' },
                        { type: 'circle', label: '07', active: true }
                    ],
                    MC: [
                        { type: 'empty', border: true },
                        { type: 'tag', label: 'B', sub: '13' },
                        { type: 'tag', label: 'B', sub: '01' },
                        { type: 'tag', label: 'B', sub: '16' },
                        { type: 'tag', label: 'B', sub: '07', active: true }
                    ],
                    HYD: [],
                    PRC: [],
                    CBR: [],
                    THR: [],
                    UCC: [],
                    ORG: [],
                    PRM: [],
                    AC: [],
                    SPG: []
                }
            }
        ];*/

        console.log(JSON.parse(localStorage.getItem('initialData3')));

        const colKeys = ["GS", "PI", "MC", "HYD", "PRC", "CBR", /*"THR", "UCC", "ORG", "PRM", "AC", "SPG"*/];
        let activeMenuIndex = null;
        let editingPlantIndex = null;
        let deletingPlantIndex = null;
        let editingBlockCoords = null;
        let draggedRowIndex = null;

        function renderDashboard() {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = '';

            const headerRow = document.createElement('div');
            headerRow.className = "dashboard-row border-b border-bordercol font-semibold text-zinc-400 bg-[#111]";
            
            let headerHtml = `<div id="clock" class="dashboard-cell px-4 py-3.5 border-r border-bordercol whitespace-nowrap">00:00</div>`;

            colKeys.forEach(key => {
                headerHtml += `
                    <div class="dashboard-cell px-3 py-3.5 border-r border-bordercol text-center whitespace-nowrap">
                        ${key}
                    </div>
                `;
            });

            headerHtml += `<div class="dashboard-cell px-2 py-3.5 text-center"></div>`;
            headerRow.innerHTML = headerHtml;
            container.appendChild(headerRow);

            initialData.forEach((plant, plantIndex) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = "dashboard-row border-b border-bordercol hover:bg-[#141414] transition-colors relative cursor-grab";
                rowDiv.draggable = true;
                rowDiv.dataset.index = plantIndex;

                rowDiv.addEventListener('dragstart', (e) => {
                    draggedRowIndex = plantIndex;
                    rowDiv.classList.add('dragging');
                });

                rowDiv.addEventListener('dragend', (e) => {
                    rowDiv.classList.remove('dragging');
                    document.querySelectorAll('.dashboard-row').forEach(r => r.classList.remove('drag-over'));
                });

                rowDiv.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedRowIndex !== plantIndex) {
                        rowDiv.classList.add('drag-over');
                    }
                });

                rowDiv.addEventListener('dragleave', (e) => {
                    rowDiv.classList.remove('drag-over');
                });

                rowDiv.addEventListener('drop', (e) => {
                    e.preventDefault();
                    rowDiv.classList.remove('drag-over');
                    if (draggedRowIndex !== null && draggedRowIndex !== plantIndex) {
                        const movedItem = initialData.splice(draggedRowIndex, 1)[0];
                        initialData.splice(plantIndex, 0, movedItem);
                        localStorage.setItem('initialData', JSON.stringify(initialData));
                        draggedRowIndex = null;
                        renderDashboard();
                    }
                });

                let rowHtml = `
                    <div class="dashboard-cell px-3 py-3.5 border-r border-bordercol whitespace-nowrap">
                        <div class="flex items-center gap-3">
                            <div class="text-zinc-600 hover:text-zinc-400 cursor-grab flex items-center pr-1 shrink-0" title="Drag to reorder">
                                <i class="fa-solid fa-grip-vertical"></i>
                            </div>
                            <div class="flex flex-col justify-center">
                                <span class="text-zinc-200 font-medium tracking-tight project-title-text">${plant.name}</span>
                                <span class="text-zinc-500 tracking-wider">${plant.code}</span>
                            </div>
                        </div>
                    </div>
                `;

                colKeys.forEach(key => {
                    rowHtml += `<div class="dashboard-cell p-2 border-r border-bordercol whitespace-nowrap"><div class="inline-flex items-center flex-wrap gap-1.5">`;
                    const items = plant.columns[key] || [];

                    items.forEach((item, itemIndex) => {
                        const isCircle = key === 'PI';
                        if (item.type === 'empty' || item.type === 'empty-circle') {
                            const roundedClass = isCircle ? 'rounded-full' : 'rounded';
                            rowHtml += `
                                <div onclick="openBlockModal(${plantIndex}, '${key}', ${itemIndex})" class="square-block border border-zinc-700 ${roundedClass} flex items-center justify-center cursor-pointer hover:border-zinc-500 bg-zinc-950/40 font-bold text-zinc-300" title="Configure block">
                                    ${item.label ? item.label : ''}
                                </div>
                            `;
                        } else if (item.type === 'tag') {
                            const bgClass = item.active ? 'bg-emerald-700 text-white' : 'bg-zinc-800 text-zinc-200';
                            rowHtml += `
                                <div onclick="openBlockModal(${plantIndex}, '${key}', ${itemIndex})" class="square-block ${bgClass} rounded flex flex-col items-center justify-center font-bold leading-none cursor-pointer hover:opacity-90 pt-[1px]" title="Configure block">
                                    <span class="leading-none">${item.label || ''}</span>
                                    <span class="leading-none mt-0.5">${item.sub || ''}</span>
                                </div>
                            `;
                        } else if (item.type === 'circle') {
                            const bgClass = item.active ? 'bg-emerald-700 text-white' : 'bg-zinc-800 text-zinc-200';
                            rowHtml += `
                                <div onclick="openBlockModal(${plantIndex}, '${key}', ${itemIndex})" class="square-block ${bgClass} rounded-full flex flex-col items-center justify-center font-bold tracking-tighter cursor-pointer hover:opacity-90" title="Configure block">
                                    <span class="leading-none">${item.label || ''}</span>
                                    <span class="leading-none mt-0.5">${item.sub || ''}</span>
                                </div>
                            `;
                        }
                    });

                    const isCircleCol = key === 'PI';
                    const roundedAddClass = isCircleCol ? 'rounded-full' : 'rounded';
                    rowHtml += `
                        <div onclick="addEmptyItem(${plantIndex}, '${key}')" class="square-block border border-dashed border-zinc-600 ${roundedAddClass} flex items-center justify-center text-zinc-500 cursor-pointer hover:border-zinc-400 hover:text-zinc-300" title="Add block">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                    `;

                    rowHtml += `</div></div>`;
                });

                const isMenuOpen = activeMenuIndex === plantIndex;
                rowHtml += `
                    <div class="dashboard-cell px-3 text-center relative">
                        <button onclick="toggleMenu(event, ${plantIndex})" class="w-8 h-8 inline-flex items-center justify-center text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800/60 rounded cursor-pointer transition-colors">
                            <i class="fa-solid fa-gear"></i>
                        </button>
                        ${isMenuOpen ? `
                            <div class="absolute right-8 top-10 w-48 bg-zinc-900 border border-bordercol rounded-md shadow-xl py-1 z-50 flex flex-col text-left" onclick="event.stopPropagation()">
                                <button onclick="openEditModal(${plantIndex})" class="flex items-center gap-2 px-3 py-2 text-zinc-300 hover:bg-zinc-800 text-left cursor-pointer transition-colors">
                                    <i class="fa-solid fa-pen text-zinc-400 w-4"></i> Edit Name & Number
                                </button>
                                <button onclick="promptDeleteRow(${plantIndex})" class="flex items-center gap-2 px-3 py-2 text-red-400 hover:bg-zinc-800 text-left cursor-pointer transition-colors">
                                    <i class="fa-solid fa-trash w-4"></i> Remove Row
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;

                rowDiv.innerHTML = rowHtml;
                container.appendChild(rowDiv);
            });
        }

        function toggleMenu(event, plantIndex) {
            event.stopPropagation();
            if (activeMenuIndex === plantIndex) {
                activeMenuIndex = null;
            } else {
                activeMenuIndex = plantIndex;
            }
            renderDashboard();
        }

        function closeAllMenus(event) {
            if (activeMenuIndex !== null) {
                activeMenuIndex = null;
                renderDashboard();
            }
        }

        function openEditModal(plantIndex) {
            activeMenuIndex = null;
            editingPlantIndex = plantIndex;
            const plant = initialData[plantIndex];
            document.getElementById('edit-name-input').value = plant.name;
            document.getElementById('edit-code-input').value = plant.code;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal(event) {
            if (!event || event.target.id === 'edit-modal' || event.target.tagName === 'BUTTON') {
                document.getElementById('edit-modal').classList.add('hidden');
                editingPlantIndex = null;
            }
        }

        function saveProjectEdit() {
            if (editingPlantIndex !== null) {
                const newName = document.getElementById('edit-name-input').value.trim();
                const newCode = document.getElementById('edit-code-input').value.trim();
                if (newName) {
                    initialData[editingPlantIndex].name = newName;
                    localStorage.setItem('initialData', JSON.stringify(initialData));
                }
                if (newCode) {
                    initialData[editingPlantIndex].code = newCode;
                    localStorage.setItem('initialData', JSON.stringify(initialData));
                }
            }
            document.getElementById('edit-modal').classList.add('hidden');
            editingPlantIndex = null;
            renderDashboard();
        }

        function promptDeleteRow(plantIndex) {
            activeMenuIndex = null;
            deletingPlantIndex = plantIndex;
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        function closeDeleteModal(event) {
            if (!event || event.target.id === 'delete-modal' || event.target.tagName === 'BUTTON') {
                document.getElementById('delete-modal').classList.add('hidden');
                deletingPlantIndex = null;
            }
        }

        function confirmDeleteRow() {
            if (deletingPlantIndex !== null) {
                initialData.splice(deletingPlantIndex, 1);
                localStorage.setItem('initialData', JSON.stringify(initialData));
            }
            document.getElementById('delete-modal').classList.add('hidden');
            deletingPlantIndex = null;
            renderDashboard();
        }

        function addEmptyItem(plantIndex, colKey) {
            const plant = initialData[plantIndex];
            if (!plant.columns[colKey]) {
                plant.columns[colKey] = [];
            }
            const isCircle = colKey === 'PI';
            plant.columns[colKey].push({
                type: isCircle ? 'empty-circle' : 'empty',
                label: '',
                sub: '',
                active: false
            });
            localStorage.setItem('initialData', JSON.stringify(initialData));
            renderDashboard();
        }

        function openBlockModal(plantIndex, colKey, itemIndex) {
            editingBlockCoords = { plantIndex, colKey, itemIndex };
            const item = initialData[plantIndex].columns[colKey][itemIndex];
            const isCircle = colKey === 'PI';

            document.getElementById('block-label-input').value = item.label || '';
            document.getElementById('block-sub-input').value = item.sub || '';
            document.getElementById('block-active-input').checked = !!item.active;

            const subContainer = document.getElementById('sub-label-container');
            if (isCircle) {
                //subContainer.classList.add('hidden');
            } else {
                subContainer.classList.remove('hidden');
            }

            const modalBox = document.getElementById('block-modal-box');
            const modalOverlay = document.getElementById('block-modal');
            modalOverlay.classList.remove('hidden');

            const rect = event.currentTarget.getBoundingClientRect();
            const modalWidth = 320;
            const modalHeight = 220;

            let left = rect.left;
            let top = rect.bottom + 8;

            // Ensure the popup doesn't overflow outside the viewport right boundary
            if (left + modalWidth > window.innerWidth - 20) {
                left = window.innerWidth - modalWidth - 20;
            }
            if (left < 10) left = 10;

            // If it goes off the bottom, display it above the clicked element instead
            if (top + modalHeight > window.innerHeight - 20) {
                top = rect.top - modalHeight - 8;
            }

            modalBox.style.left = `${left}px`;
            modalBox.style.top = `${top}px`;

            document.getElementById('block-modal').classList.remove('hidden');
        }

        function closeBlockModal(event) {
            if (!event || event.target.id === 'block-modal' || event.target.tagName === 'BUTTON') {
                document.getElementById('block-modal').classList.add('hidden');
                editingBlockCoords = null;
            }
        }

        function saveBlockEdit() {
            if (editingBlockCoords !== null) {
                const { plantIndex, colKey, itemIndex } = editingBlockCoords;
                const item = initialData[plantIndex].columns[colKey][itemIndex];
                const labelVal = document.getElementById('block-label-input').value.trim();
                const subVal = document.getElementById('block-sub-input').value.trim();
                const activeVal = document.getElementById('block-active-input').checked;
                const isCircle = colKey === 'PI';

                item.label = labelVal;
                item.sub = subVal;
                item.active = activeVal;

                if (labelVal !== '' || subVal !== '') {
                    item.type = isCircle ? 'circle' : 'tag';
                } else {
                    item.type = isCircle ? 'empty-circle' : 'empty';
                }
            }
            document.getElementById('block-modal').classList.add('hidden');
            editingBlockCoords = null;
            localStorage.setItem('initialData', JSON.stringify(initialData));
            renderDashboard();
        }

        function deleteCurrentBlock() {
            if (editingBlockCoords !== null) {
                const { plantIndex, colKey, itemIndex } = editingBlockCoords;
                initialData[plantIndex].columns[colKey].splice(itemIndex, 1);
                localStorage.setItem('initialData', JSON.stringify(initialData));
            }
            document.getElementById('block-modal').classList.add('hidden');
            editingBlockCoords = null;
            renderDashboard();
        }

        function addProjectRow() {
            const plantNames = ["Apex Industrial", "Blue Ridge Facility", "Cascade Bio", "Delta Dynamics", "Echo Energy"];
            const randomName = plantNames[Math.floor(Math.random() * plantNames.length)] + " " + Math.floor(Math.random() * 900 + 100);
            const randomCode = String(Math.floor(Math.random() * 900000 + 100000));

            const newColumns = {};
            colKeys.forEach(k => {
                newColumns[k] = [];
            });

            initialData.push({
                name: randomName,
                code: randomCode,
                columns: newColumns
            });
            localStorage.setItem('initialData', JSON.stringify(initialData));
            renderDashboard();
        }

        window.onload = function() {
            renderDashboard();
        };

        updateClock();
		setInterval(updateClock, 1000);
		setInterval(renderDashboard, 60000);
    </script>


</body></html>
